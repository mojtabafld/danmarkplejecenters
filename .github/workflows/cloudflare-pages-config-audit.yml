name: Cloudflare Pages configuration audit (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/migration/cloudflare-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PAGES_PROJECT: danmarkplejecenters-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-workers

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Discover Cloudflare account
        id: account
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!token) throw new Error('CLOUDFLARE_API_TOKEN secret is missing.');
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=50', {
            headers: { Authorization: 'Bearer ' + token }
          });
          const body = await response.json();
          if (!response.ok || body.success === false) throw new Error('Cloudflare account lookup failed.');
          if (body.result?.length !== 1) throw new Error('Expected one accessible account; found ' + (body.result?.length ?? 0) + '.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'account_id=' + body.result[0].id + '\n');
          NODE

      - name: Download current Pages settings without deploying
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          AUDIT_DIR: ${{ runner.temp }}/pages-config-audit
        run: |
          mkdir -p "$AUDIT_DIR"
          cd "$AUDIT_DIR"
          npx --yes wrangler@4 pages download config "$CF_PAGES_PROJECT"

      - name: Summarize current bindings and runtime settings (values redacted)
        shell: bash
        env:
          AUDIT_DIR: ${{ runner.temp }}/pages-config-audit
        run: |
          cd "$AUDIT_DIR"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync, existsSync } from 'node:fs';
          const path = ['wrangler.jsonc', 'wrangler.json', 'wrangler.toml'].find(existsSync);
          if (!path) throw new Error('Wrangler did not create a config file.');
          const source = readFileSync(path, 'utf8');
          const allowed = /(^\s*\$schema|^\s*name\s*[:=]|pages_build_output_dir|compatibility_date|compatibility_flags|binding|hyperdrive|durable_objects|script_name|class_name|production|preview|^\s*id\s*[:=])/i;
          const lines = source.split('\n').filter(line => allowed.test(line));
          const summary = [
            '## Cloudflare Pages configuration audit',
            '',
            '- Project: ' + process.env.CF_PAGES_PROJECT,
            '- Downloaded file: ' + path,
            '- Operation: read-only; no deployment or Cloudflare settings were changed.',
            '- Only runtime/binding identifiers are shown below; variable values and secrets are not printed.',
            '',
            '### Relevant configuration lines',
            '```',
            ...lines,
            '```',
            '',
            'Review the production environment bindings before adopting a repository Wrangler file.'
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          console.log(summary.join('\n'));
          NODE
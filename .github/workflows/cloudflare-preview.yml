name: Cloudflare migration preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-migration-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/migration/cloudflare-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PAGES_PROJECT: danmarkplejecenters-migration
      CF_PREVIEW_BRANCH: migration/cloudflare-workers

    steps:
      - name: Validate required secret
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-workers

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Discover Cloudflare account and ensure isolated Pages project
        id: cloudflare
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const base = 'https://api.cloudflare.com/client/v4';
          async function api(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {})
              }
            });
            const body = await response.json();
            if (!response.ok || body.success === false) {
              throw new Error(`Cloudflare API ${response.status}: ${JSON.stringify(body.errors || body)}`);
            }
            return body;
          }

          const accounts = (await api('/accounts?per_page=50')).result || [];
          if (accounts.length !== 1) {
            throw new Error(`Expected exactly one accessible Cloudflare account, found ${accounts.length}. Add CLOUDFLARE_ACCOUNT_ID as a repository secret and adjust account selection before retrying.`);
          }
          const accountId = accounts[0].id;
          const projectName = process.env.CF_PAGES_PROJECT;
          const projects = (await api(`/accounts/${accountId}/pages/projects?per_page=100`)).result || [];
          const existing = projects.find(project => project.name === projectName);
          if (!existing) {
            await api(`/accounts/${accountId}/pages/projects`, {
              method: 'POST',
              body: JSON.stringify({ name: projectName, production_branch: 'main' })
            });
            coreOutput('pages_project_action', 'created');
          } else {
            if (existing.production_branch !== 'main') {
              throw new Error(`Existing Pages project production branch is "${existing.production_branch}", not "main". Refusing to change it automatically.`);
            }
            coreOutput('pages_project_action', 'reused');
          }
          coreOutput('account_id', accountId);

          function coreOutput(name, value) {
            appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          NODE

      - name: Deploy authentication rate-limiter Durable Object Worker
        run: npx --yes wrangler@4 deploy --config workers/auth-rate-limiter/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Deploy isolated Pages preview
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name "$CF_PAGES_PROJECT"
          --branch "$CF_PREVIEW_BRANCH"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Cloudflare migration preview deployed"
            echo
            echo "- Pages project: `$CF_PAGES_PROJECT`"
            echo "- Branch: `$CF_PREVIEW_BRANCH` (preview, not production)"
            echo "- Production branch: `main`"
            echo "- Durable Object rate limiter: deployed"
            echo "- Production DNS/database: untouched"
            echo
            echo "This first deployment intentionally does not attach a database or production secrets."
          } >> "$GITHUB_STEP_SUMMARY"

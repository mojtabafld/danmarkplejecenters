# Put main on the production server, every time main changes.
#
# Build and test here, on GitHub's runner, then ship the result. The server is
# a 1 GB machine and the build peaks at 536 MB, which is the one thing that
# killed a deploy on it; so nothing is built there. It receives the 2.1 MB of
# dist/, installs three runtime dependencies, swaps directories and restarts.
# scripts/remote-deploy.sh is the server half, and it rolls itself back if the
# new version does not answer /api/health.
#
# Configured under Settings → Secrets and variables → Actions:
#
#   secrets   DEPLOY_SSH_KEY      private half of a key used for nothing else
#             DEPLOY_HOST         the server's IP or hostname
#             DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
#   variables DEPLOY_USER         default ubuntu
#             DEPLOY_PATH         default /srv/plejekort
#             DEPLOY_PORT         default 8080
#
# Until the three secrets exist this still builds and tests, then says it
# skipped the deploy and stays green -- so merging the workflow does not turn
# every commit red before anybody has had a chance to set it up.
#
# The host key is pinned rather than accepted on first sight. A workflow that
# skips host-key checking will hand the build, and the server's trust, to
# whatever answers on that IP.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in order. Cancelling a deploy half-way through a
# directory swap is worse than waiting for it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run build
      # Nothing reaches the server that has not passed the same checks CI runs.
      - run: npm test

      - name: Is deploying configured?
        id: cfg
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ] && [ -n "$KNOWN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "Built and tested, but not deployed: DEPLOY_SSH_KEY, DEPLOY_HOST and"
              echo "DEPLOY_KNOWN_HOSTS must all be set. See docs/DEPLOY-VPS.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Deploy skipped — the DEPLOY_* secrets are not set yet"
          fi

      - name: Set up SSH
        if: steps.cfg.outputs.configured == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload the build
        if: steps.cfg.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          APP: ${{ vars.DEPLOY_PATH || '/srv/plejekort' }}
        run: |
          # Into dist.next, not dist: the live directory is only replaced once
          # the whole build is on the server, by remote-deploy.sh.
          #
          # tar over ssh, not rsync: rsync has to be installed at BOTH ends and
          # a fresh server image need not have it. The whole build is 2.1 MB,
          # so sending all of it every time costs nothing worth optimising.
          tar -C dist -czf - . | ssh -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o BatchMode=yes "$USER_@$HOST" \
            "rm -rf '$APP/dist.next' && mkdir -p '$APP/dist.next' && tar -C '$APP/dist.next' -xzf -"

      - name: Switch over and check health
        if: steps.cfg.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ vars.DEPLOY_USER || 'ubuntu' }}
          APP: ${{ vars.DEPLOY_PATH || '/srv/plejekort' }}
          PORT: ${{ vars.DEPLOY_PORT || '8080' }}
        run: |
          ssh -i "$HOME/.ssh/deploy" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$USER_@$HOST" 'bash -s' -- "$APP" "$GITHUB_SHA" "$PORT" < scripts/remote-deploy.sh
          echo "### Deployed \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy

name: Cloudflare Production deployment

on:
  push:
    branches:
      - migration/cloudflare-workers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/migration/cloudflare-workers'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: 4f022b9e5bca1c40f58a59f0cb1f1e5e
      CF_PAGES_PROJECT: danmarkplejecenters-migration
      CF_PRODUCTION_BRANCH: migration/cloudflare-workers
      PUBLIC_ORIGIN: https://plejefinder.online

    steps:
      - name: Check Cloudflare credential is available
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::GitHub repository secret CLOUDFLARE_API_TOKEN is missing."
            exit 1
          fi

      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-workers

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build frontend and admin application
        run: npm run build

      - name: Compile Pages Functions
        run: >-
          npx --yes wrangler@4 pages functions build functions
          --outdir .wrangler/pages-worker
          --compatibility-date=2026-11-02
          --compatibility-flag=nodejs_compat
          --compatibility-flag=nodejs_compat_populate_process_env

      - name: Configure required Production environment variables
        id: configure_env
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const projectName = process.env.CF_PAGES_PROJECT;
          const base = 'https://api.cloudflare.com/client/v4';
          const path = `/accounts/${accountId}/pages/projects/${projectName}`;

          async function request(method, body) {
            const response = await fetch(base + path, {
              method,
              headers: {
                Authorization: 'Bearer ' + token,
                ...(body ? { 'Content-Type': 'application/json' } : {})
              },
              ...(body ? { body: JSON.stringify(body) } : {})
            });
            const result = await response.json();
            if (!response.ok || result.success === false || !result.result) {
              const errors = (result.errors || []).map(e => e.code + ':' + e.message).join('; ');
              throw new Error('Cloudflare Pages configuration API failed (' + response.status + '): ' + errors);
            }
            return result.result;
          }

          const project = await request('GET');
          if (!(project.domains || []).includes('plejefinder.online')) {
            throw new Error('Expected custom domain is not attached. Refusing to change environment.');
          }

          const existing = project.deployment_configs?.production?.env_vars || {};

          // Pages secrets are stored only in Cloudflare. Preserve the existing
          // value; generate a fresh random salt only if it is genuinely absent.
          if (!Object.hasOwn(existing, 'TRAFFIC_HASH_SECRET')) {
            await request('PATCH', {
              deployment_configs: {
                production: {
                  env_vars: {
                    TRAFFIC_HASH_SECRET: {
                      type: 'secret_text',
                      value: randomBytes(48).toString('base64url')
                    }
                  }
                }
              }
            });
          }

          const auditToken = randomBytes(32).toString('base64url');
          await request('PATCH', {
            deployment_configs: {
              production: {
                env_vars: {
                  SCHEMA_AUDIT_TOKEN: { type: 'secret_text', value: auditToken }
                }
              }
            }
          });

          const confirmedProject = await request('GET');
          const confirmed = confirmedProject.deployment_configs?.production?.env_vars || {};
          if (!Object.hasOwn(confirmed, 'TRAFFIC_HASH_SECRET') || !Object.hasOwn(confirmed, 'SCHEMA_AUDIT_TOKEN')) {
            throw new Error('Cloudflare did not confirm the required Production secrets.');
          }

          console.log('::add-mask::' + auditToken);
          appendFileSync(process.env.GITHUB_OUTPUT, 'schema_audit_token=' + auditToken + String.fromCharCode(10));
          console.log('Production traffic secret and temporary schema-audit secret are present in Cloudflare. Values were not displayed or stored in the repository.');
          NODE

      - name: Verify Cloudflare production target and required configuration
        id: preflight
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const base = 'https://api.cloudflare.com/client/v4';

          async function api(path) {
            const response = await fetch(base + path, {
              headers: { Authorization: 'Bearer ' + token }
            });
            const body = await response.json();
            if (!response.ok || body.success === false || !body.result) {
              throw new Error('Cloudflare preflight API request failed: ' + response.status);
            }
            return body.result;
          }

          let project = await api(`/accounts/${accountId}/pages/projects/${process.env.CF_PAGES_PROJECT}`);
          const domains = project.domains || [];
          const vars = project.deployment_configs?.production?.env_vars || {};
          const missing = Object.hasOwn(vars, 'TRAFFIC_HASH_SECRET') ? [] : ['TRAFFIC_HASH_SECRET'];

          const reportedBranch = [...String(project.production_branch || '')].filter(ch => ![0x200e, 0x200f, 0x202a, 0x202b, 0x202c, 0x202d, 0x202e].includes(ch.codePointAt(0))).join('').trim();
          console.log('Cloudflare Production branch reported by API:', JSON.stringify(project.production_branch || '(unset)'));
          console.log('Cloudflare Pages domains reported by API:', domains.join(', ') || '(none)');
          console.log('Production secret names reported by API:', Object.keys(vars).sort().join(', ') || '(none)');

          if (!domains.includes('plejefinder.online')) {
            throw new Error('Custom domain plejefinder.online is not attached to this Pages project according to Cloudflare API. Refusing to deploy.');
          }
          if (missing.length) {
            throw new Error('Missing required Production variable/secret names: ' + missing.join(', ') + '. No deployment was made.');
          }

          if (String(project.production_branch || '') !== process.env.CF_PRODUCTION_BRANCH) {
            if (reportedBranch !== process.env.CF_PRODUCTION_BRANCH && reportedBranch !== 'main' && reportedBranch !== '') {
              throw new Error('Unexpected Production branch value. Refusing to change it automatically.');
            }
            const response = await fetch(base + `/accounts/${accountId}/pages/projects/${process.env.CF_PAGES_PROJECT}`, {
              method: 'PATCH',
              headers: {
                Authorization: 'Bearer ' + token,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ production_branch: process.env.CF_PRODUCTION_BRANCH })
            });
            const body = await response.json();
            if (!response.ok || body.success === false || body.result?.production_branch !== process.env.CF_PRODUCTION_BRANCH) {
              throw new Error('Cloudflare did not confirm the exact Production branch name. Refusing to deploy.');
            }
            project = body.result;
            console.log('Production branch metadata was normalized to the exact branch name and confirmed by Cloudflare.');
          }

          const hyperdrive = await api(`/accounts/${accountId}/hyperdrive/configs/6fe7a645ae83497c8c95a103797d309b`);
          const origin = hyperdrive.origin || {};
          if (hyperdrive.name !== 'plejefinder-db' ||
              origin.host !== 'db.bguarjpivuxifkhhrhda.supabase.co' ||
              Number(origin.port) !== 5432 ||
              origin.database !== 'postgres') {
            throw new Error('Hyperdrive target does not match the approved Supabase Production database. Refusing to deploy.');
          }

          const wrangler = readFileSync('wrangler.toml', 'utf8');
          for (const fragment of [
            'pages_build_output_dir = "./dist"',
            '[env.production.vars]',
            'PUBLIC_URL = "https://plejefinder.online"',
            'ADMIN_EMAILS = "mojtaba.devops@gmail.com"',
            'binding = "HYPERDRIVE"',
            'id = "6fe7a645ae83497c8c95a103797d309b"',
            'name = "AUTH_RATE_LIMITER"',
            'script_name = "danmarkplejecenters-auth-rate-limiter"',
          ]) {
            if (!wrangler.includes(fragment)) {
              throw new Error('wrangler.toml is missing expected production binding configuration. Refusing to deploy.');
            }
          }

          const nl = String.fromCharCode(10);
          appendFileSync(process.env.GITHUB_OUTPUT, 'account_id=' + accountId + nl);
          const summary = [
            '## Production preflight passed',
            '',
            '- Pages project and production branch match the approved target.',
            '- Custom domain is attached.',
            '- Production public URL and admin email are declared in the Wrangler production config; traffic secret is stored in Cloudflare.',
            '- Hyperdrive points to the approved Supabase Production database (credentials not displayed).',
            '- Wrangler config includes the production Hyperdrive and Durable Object bindings.',
            '- Email remains optional; MAIL_FROM and RESEND_API_KEY are not required for this release.',
          ].join(nl);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + nl);
          console.log(summary);
          NODE

      - name: Deploy authentication rate-limiter Durable Object
        run: npx --yes wrangler@4 deploy --config workers/auth-rate-limiter/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}

      - name: Publish Pages Production deployment
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name "$CF_PAGES_PROJECT"
          --branch "$CF_PRODUCTION_BRANCH"
          --commit-hash "$GITHUB_SHA"
          --commit-message "$DEPLOY_COMMIT_MESSAGE"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Confirm deployment was classified as Production
        id: deployment_info
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CF_ACCOUNT_ID;
          const project = process.env.CF_PAGES_PROJECT;
          const branch = process.env.CF_PRODUCTION_BRANCH;
          const sha = process.env.GITHUB_SHA;
          const base = 'https://api.cloudflare.com/client/v4';
          const response = await fetch(`${base}/accounts/${accountId}/pages/projects/${project}/deployments?env=production&per_page=10`, {
            headers: { Authorization: 'Bearer ' + token }
          });
          const body = await response.json();
          if (!response.ok || body.success === false || !Array.isArray(body.result)) {
            throw new Error('Could not verify Cloudflare Production deployment list.');
          }
          const deployment = body.result.find(item => item.deployment_trigger?.metadata?.commit_hash === sha);
          if (!deployment) {
            const latest = body.result[0];
            throw new Error('Cloudflare did not classify this commit as Production. Latest Production branch=' +
              String(latest?.deployment_trigger?.metadata?.branch || '(none)') +
              ', latest commit=' + String(latest?.deployment_trigger?.metadata?.commit_hash || '(none)') +
              '. Current deployment was not verified as Production.');
          }
          const names = Object.keys(deployment.env_vars || {}).sort();
          console.log('Confirmed Production deployment:', JSON.stringify({
            environment: deployment.environment,
            branch: deployment.deployment_trigger?.metadata?.branch,
            commit: deployment.deployment_trigger?.metadata?.commit_hash,
            url: deployment.url,
            aliases: deployment.aliases,
            envVarNames: names
          }));
          if (deployment.environment !== 'production' ||
              deployment.deployment_trigger?.metadata?.branch !== branch) {
            throw new Error('Deployment metadata does not match the intended Production branch.');
          }
          const nl = String.fromCharCode(10);
          appendFileSync(process.env.GITHUB_OUTPUT, 'deployment_url=' + deployment.url + nl);
          NODE
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify live Production endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in "$PUBLIC_ORIGIN/" "$PUBLIC_ORIGIN/api/health"; do
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-connrefused "$endpoint" -o /dev/null
          done

          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-connrefused \
            "$PUBLIC_ORIGIN/api/health" -o "$RUNNER_TEMP/health.json"

          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const schemaResponse = await fetch(process.env.PUBLIC_ORIGIN + '/api/health/schema', {
            headers: { 'x-schema-audit-token': process.env.SCHEMA_AUDIT_TOKEN, 'cache-control': 'no-cache' }
          });
          if (!schemaResponse.ok) {
            throw new Error('Read-only Production database schema audit endpoint failed with HTTP ' + schemaResponse.status);
          }
          const schema = await schemaResponse.json();
          console.log('Read-only Production schema audit:', JSON.stringify(schema));
          if (schema.ok !== true) {
            throw new Error('Production database schema is incomplete. No database DDL was run. Missing tables: ' +
              (schema.missingTables || []).join(', ') + '; missing columns: ' +
              (schema.missingColumns || []).join(', '));
          }

          const health = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/health.json', 'utf8'));
          console.log('Sanitized Production health:', JSON.stringify({
            database: health.database,
            publicUrl: health.publicUrl,
            admins: health.admins,
            mail: health.mail,
            mailVars: health.mailVars
          }));
          if (health.database !== 'ready') {
            throw new Error('Production database health check is not ready: ' + String(health.database));
          }
          if (health.publicUrl !== true || !Number.isInteger(health.admins) || health.admins < 1) {
            throw new Error('Production runtime configuration health check failed.');
          }

          for (const path of ['/api/auth/me', '/api/ratings']) {
            const response = await fetch(process.env.PUBLIC_ORIGIN + path, {
              headers: { 'cache-control': 'no-cache' }
            });
            if (!response.ok) throw new Error(path + ' smoke test failed with HTTP ' + response.status);
          }

          const nl = String.fromCharCode(10);
          const summary = [
            '## Production smoke tests passed',
            '',
            '- Site and API health endpoint respond over the custom domain.',
            '- Hyperdrive-backed database reports ready.',
            '- Authentication session endpoint and public ratings endpoint respond successfully.',
            '- Mail status: ' + String(health.mail || 'not reported') + ' (email features remain disabled when mail is not configured).',
            '- Production URL: ' + process.env.PUBLIC_ORIGIN,
          ].join(nl);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + nl);
          console.log(summary);
          NODE
        env:
          PUBLIC_ORIGIN: https://plejefinder.online
          SCHEMA_AUDIT_TOKEN: ${{ steps.configure_env.outputs.schema_audit_token }}

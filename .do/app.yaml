# DigitalOcean App Platform spec.
#
# A web service, not a static site: accounts and the visited list need a process
# and a database. The map, the search and the cards do not -- without a database
# the API answers 503 and the site works exactly as it did before, so a missing
# binding degrades the feature rather than the app.
#
# Create it from this file with:
#   doctl apps create --spec .do/app.yaml
#
# Or connect the repo in the App Platform UI, which detects the same settings.
name: danmarkplejecenters
region: fra

services:
  - name: web
    environment_slug: node-js

    github:
      repo: mojtabafld/danmarkplejecenters
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    envs:
      # The binding that makes accounts work. The name in ${...} must match the
      # database component's name. Never paste the connection string itself: it
      # carries the password, and this file is in git.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${dev-db-718494.DATABASE_URL}

      # Where the verification link points. Without it the link is built from
      # the request's own host, which is right in almost every case but wrong
      # behind a proxy that rewrites it.
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: https://plejefinder.online

      # Mail, for verifying addresses. SMTP_URL is a single connection string,
      # e.g. smtps://apikey:SG.xxxx@smtp.sendgrid.net:465 -- set it as a SECRET,
      # not as a plain value. Without it, sign-up reports that verification mail
      # cannot be sent rather than creating accounts nobody can confirm.
      - key: SMTP_URL
        scope: RUN_TIME
        type: SECRET
        value: ""
      - key: MAIL_FROM
        scope: RUN_TIME
        value: "Plejecentre <no-reply@plejefinder.online>"

databases:
  - name: dev-db-718494
    engine: PG
    production: false

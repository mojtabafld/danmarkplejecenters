# DigitalOcean App Platform spec.
#
# A web service, not a static site: accounts and the visited list need a process
# and a database. The map, the search and the cards do not -- without a database
# the API answers 503 and the site works exactly as it did before, so a missing
# binding degrades the feature rather than the app.
#
# Create it from this file with:
#   doctl apps create --spec .do/app.yaml
#
# Or connect the repo in the App Platform UI, which detects the same settings.
name: danmarkplejecenters
region: fra

services:
  - name: web
    environment_slug: node-js

    github:
      repo: mojtabafld/danmarkplejecenters
      branch: main
      deploy_on_push: true

    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb

    envs:
      # DATABASE_URL is deliberately NOT here.
      #
      # Attaching a dev database in the App Platform UI injects it into this
      # component by itself, and an explicit entry then has to name the database
      # component exactly. This file used to carry
      # `${dev-db-718494.DATABASE_URL}`, pointing at a component that had been
      # deleted -- a reference that resolves to nothing and takes accounts down
      # silently, because the app treats a missing database as "accounts off"
      # rather than as a crash.
      #
      # If you create the app from this spec with `doctl apps create --spec`
      # instead of the UI, add it back with the name from the `databases:`
      # block below, and never the connection string itself -- it carries a
      # password and this repository is public.

      # Where the verification link points. Without it the link is built from
      # the request's own host, which is right in almost every case but wrong
      # behind a proxy that rewrites it.
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: https://plejefinder.online

      # Who may open /admin. Comma-separated addresses; each still has to hold
      # a confirmed account with a password, so being listed is permission
      # rather than a way in. Left empty, /admin refuses everybody, which is
      # the right default for a component nobody has claimed yet.
      - key: ADMIN_EMAILS
        scope: RUN_TIME
        value: ""

      # Mail, for verifying addresses. Discrete variables rather than a URL,
      # because a mailbox password containing @ : or / silently truncates a
      # connection string and the failure then looks like a wrong host.
      #
      # For a domain hosted at Simply.com, use smtp.simply.com -- NOT
      # websmtp.simply.com, which their documentation restricts to scripts
      # running on Simply's own web servers and which will refuse this app.
      # Port 587 negotiates STARTTLS, which the app requires rather than
      # merely prefers.
      - key: SMTP_HOST
        scope: RUN_TIME
        value: smtp.simply.com
      - key: SMTP_PORT
        scope: RUN_TIME
        value: "587"
      - key: SMTP_USER
        scope: RUN_TIME
        value: no-reply@plejefinder.online
      # Set in the App Platform UI with "Encrypt" ticked, not here. DO stores
      # it encrypted, hands it to the process at run time, and keeps it across
      # every deploy -- so it is entered once and never lives in git. A plain
      # value committed to this file would be public the moment it is pushed.
      - key: SMTP_PASS
        scope: RUN_TIME
        type: SECRET
        value: ""

      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        type: SECRET
        value: ""

      # Must be an address the mailbox is allowed to send as; most providers
      # refuse anything else. Defaults to SMTP_USER when unset.
      - key: MAIL_FROM
        scope: RUN_TIME
        value: "Plejecentre <no-reply@plejefinder.online>"

# Only read when the app is created from this file with
# `doctl apps create --spec`. An app made in the UI has its own copy of the
# spec, and pushes to the repository do not re-read this one.
databases:
  - name: plejekort-db
    engine: PG
    production: false

<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Tints the browser's own chrome: Safari's address bar, Android's status
         bar. ThemeController keeps it in step with the theme; the value here is
         only what shows for the first frame. -->
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      /*
       * Runs before the first paint. The module that owns the theme is
       * deferred, so without this the page paints light for a frame and then
       * flips, and Safari has already sampled that first frame for its address
       * bar. Sets only the attribute, never a colour: the colours stay in the
       * token layer, and the module fills the meta in once the stylesheet has
       * been parsed and --header-bg actually resolves.
       *
       * It has to reach the same answer as ThemeController's constructor, by
       * the same two steps -- a stored choice first, the device's setting when
       * there is none -- or the frame this paints is the wrong one and the
       * flash it exists to prevent is the flash it causes.
       *
       * The key matches KEY in src/theme.ts.
       */
      (function () {
        var t = null;
        try {
          var v = localStorage.getItem('plejekort.theme');
          if (v === 'dark' || v === 'light') t = v;
        } catch (e) {
          /* private mode: nothing stored, so the device decides */
        }
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document
          .querySelector('meta[name="color-scheme"]')
          .setAttribute('content', t === 'dark' ? 'dark light' : 'light dark');
      })();
    </script>
    <title>Plejecentre</title>
    <!-- Home screen. The icons are full-bleed on purpose: iOS masks them to its
         squircle and Android to the launcher's shape, so an icon that arrives
         already rounded gets rounded twice. Regenerate with
         `node scripts/make-icons.mjs`. iOS 15+ tints the status bar in a
         standalone window from theme-color above, which the theme keeps in
         step, so no apple-mobile-web-app-status-bar-style is declared here. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plejecentre" />
    <meta
      name="description"
      content="Interaktivt kort over 148 plejecentre og plejehjem i hovedstadsområdet. Søg, filtrer på kommune og driftsform, og få adresse, telefon, officiel hjemmeside og rutevejledning."
    />
  </head>
  <body>
    <a class="skip-link" href="#results" data-i18n="app.skipToList"></a>

    <!--
      Shown only if the script fails before the interface is built. Its text is
      static and trilingual on purpose: the thing that renders the translations
      is exactly what has just failed, so it cannot depend on it.
    -->
    <div class="bootfail" id="bootFail" hidden role="alert">
      <div class="bootfail__card">
        <p lang="da" dir="ltr">Siden kunne ikke indlæses færdig. Genindlæs siden.</p>
        <p lang="en" dir="ltr">The page did not finish loading. Reload to try again.</p>
        <p lang="fa" dir="rtl">بارگذاری صفحه کامل نشد. صفحه را دوباره بارگذاری کنید.</p>
        <button type="button" class="btn btn--primary" id="bootFailReload" dir="ltr">
          Reload <span aria-hidden="true">&middot;</span> Genindlæs
          <span aria-hidden="true">&middot;</span>
          <span lang="fa" dir="rtl">بارگذاری دوباره</span>
        </button>
      </div>
    </div>

    <div class="app">
      <header class="masthead">
        <span class="masthead__mark" id="brandMark" aria-hidden="true"></span>
        <span class="masthead__titles">
          <h1 class="masthead__title" data-i18n="app.title"></h1>
          <p class="masthead__sub" data-i18n="app.subtitle"></p>
        </span>
        <span class="masthead__spacer"></span>

        <div class="langpick" id="account" hidden>
          <button
            type="button"
            class="langpick__button"
            id="accountButton"
            aria-expanded="false"
            aria-controls="accountPanel"
          >
            <span class="sr-only" data-i18n="account.open"></span>
            <span class="langpick__code" id="accountCode"></span>
          </button>
          <div class="langpick__menu account__panel" id="accountPanel" hidden></div>
        </div>
        <div class="account__scrim" id="accountScrim" hidden></div>

        <!-- The note editor. A small dialog in the middle of the screen: it is
             one field and two buttons, and it should not have to share the card
             with the plejecenter it is about. -->
        <div class="notedlg__scrim" id="noteScrim" hidden></div>
        <div
          class="notedlg"
          id="noteDialog"
          hidden
          role="dialog"
          aria-modal="true"
          aria-labelledby="noteDialogTitle"
        >
          <div class="account__head">
            <p class="account__heading" id="noteDialogTitle"></p>
            <button type="button" class="account__close" id="noteClose"></button>
          </div>
          <textarea class="noteedit__text" id="noteText" rows="5" maxlength="2000"></textarea>
          <p class="account__error" id="noteError" role="alert" hidden></p>
          <div class="notedlg__actions">
            <button type="button" class="btn btn--primary" id="noteSave"></button>
            <button type="button" class="btn btn--secondary" id="noteCancel"></button>
          </div>
        </div>
        <div style="display: contents">
        </div>

        <div class="langpick" id="langpick">
          <button
            type="button"
            class="langpick__button"
            id="langButton"
            aria-expanded="false"
            aria-controls="langMenu"
          >
            <span class="sr-only" data-i18n="header.language"></span>
            <span class="langpick__code" id="langCode">DA</span>
          </button>
          <div class="langpick__menu" id="langMenu" hidden></div>
        </div>

        <button type="button" class="btn btn--ghost btn--icon" id="themeToggle">
          <span class="sr-only" data-i18n="header.toDark"></span>
        </button>
      </header>

      <div class="workspace">
        <!-- ---------------------------------------------------------- rail -->
        <aside class="rail" id="rail" data-i18n-aria="results.label">
          <div class="rail__lead">
            <p class="tally">
              <span class="tally__count" id="tallyCount">148</span>
              <span class="tally__label" id="tallyLabel"></span>
            </p>

            <div class="chips" role="group" data-i18n-aria="filter.ownership">
              <button type="button" class="chip" data-own="Kommunal" data-group="Kommunal" aria-pressed="true">
                <span class="chip__mark"></span><span data-i18n="ownership.Kommunal"></span>
              </button>
              <button type="button" class="chip" data-own="Selvejende" data-group="Selvejende" aria-pressed="true">
                <span class="chip__mark"></span><span data-i18n="ownership.Selvejende"></span>
              </button>
              <button type="button" class="chip" data-own="Privat" data-group="Privat" aria-pressed="true">
                <span class="chip__mark"></span><span data-i18n="ownership.Privat"></span>
              </button>

            </div>
          </div>

          <nav class="results" id="results" data-i18n-aria="results.label"></nav>

        </aside>

        <!-- ----------------------------------------------------------- map -->
        <main class="stage">
          <div class="map" id="map" role="application" data-i18n-aria="map.label"></div>

          <div class="geo-note" id="geoNote" hidden role="status">
            <p id="geoNoteText"></p>
            <button type="button" class="geo-note__close" id="geoNoteClose">
              <span class="sr-only" data-i18n="locate.dismiss"></span>
            </button>
          </div>

          <p class="map__fallback" id="mapFallback" hidden data-i18n="map.fallback"></p>

          <!--
            The dock: a pill over the map, and the quickest way into the two
            things people come here to do.

            One segment while nobody is signed in -- search -- and two once
            somebody is, because "the places I saved" only means anything to
            an account. Pressing search grows the pill into a card with the
            field and the kommune list in it. Both are bound to the same store
            as the pair in the rail, so whichever one you use, the other says
            the same thing.

            The buttons carry no text: the label is set in script as the
            accessible name and the hover title, the way the visited filter
            does, because the search segment's name changes when it opens.
          -->
          <div class="dock" id="dock" data-open="false">
            <div class="dock__bar">
              <button
                type="button"
                class="dock__seg"
                id="dockSearchBtn"
                aria-expanded="false"
                aria-controls="dockFields"
              >
                <span class="dock__icon" id="dockSearchIcon"></span>
              </button>

              <span class="dock__split" id="dockSplit" aria-hidden="true" hidden></span>

              <button type="button" class="dock__seg" id="dockSaved" aria-pressed="false" hidden>
                <span class="dock__icon" id="dockSavedIcon"></span>
              </button>
            </div>

            <!-- Shown once, the first time somebody signs in, pointing down at
                 the saved segment above. It lives in the dock because that is
                 where the control it is about lives; role="status" so it is
                 announced rather than only seen. -->
            <div class="coach" id="savedHint" role="status" hidden>
              <span data-i18n="visit.hint"></span>
            </div>

            <div class="dock__fields" id="dockFields" hidden>
              <label class="field">
                <span class="sr-only" data-i18n="search.label"></span>
                <span class="field__icon" id="dockFieldIcon" aria-hidden="true"></span>
                <input
                  class="field__input"
                  id="dockSearch"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  data-i18n-ph="search.placeholder"
                />
                <button type="button" class="field__clear" id="dockClear" hidden>
                  <span class="sr-only" data-i18n="search.clear"></span>
                </button>
              </label>

              <label class="field">
                <span class="sr-only" data-i18n="filter.municipality"></span>
                <select class="select" id="dockMunicipality"></select>
              </label>
            </div>
          </div>

          <div class="map__tools">
            <button type="button" class="map__tool" id="locate" aria-pressed="false" data-state="idle">
              <span class="sr-only" id="locateLabel"></span>
              <span class="map__tool__icon" id="locateIcon"></span>
              <span class="map__tool__spinner" aria-hidden="true"></span>
            </button>

            <div class="map__toolgroup">
              <button type="button" class="map__tool" id="zoomIn">
                <span class="sr-only" data-i18n="map.zoomIn"></span>
              </button>
              <button type="button" class="map__tool" id="zoomOut">
                <span class="sr-only" data-i18n="map.zoomOut"></span>
              </button>
            </div>
            <button type="button" class="map__tool" id="resetView">
              <span class="sr-only" data-i18n="map.reset"></span>
            </button>
          </div>

          <section class="map__legend" data-i18n-aria="map.legend">
            <h2 data-i18n="map.legendTitle"></h2>
            <p class="legend__row" data-own="Kommunal">
              <span class="legend__mark" style="background: var(--own-mark)"></span><span data-i18n="ownership.Kommunal"></span>
            </p>
            <p class="legend__row" data-own="Selvejende">
              <span class="legend__mark" style="background: var(--own-mark)"></span><span data-i18n="ownership.Selvejende"></span>
            </p>
            <p class="legend__row" data-own="Privat">
              <span class="legend__mark" style="background: var(--own-mark)"></span><span data-i18n="ownership.PrivatLong"></span>
            </p>
          </section>

          <p class="map__credit">
            <span data-i18n="map.credit"></span>
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer"
              >OpenStreetMap</a
            >
            ·
            <a href="https://carto.com/attributions" target="_blank" rel="noopener noreferrer">CARTO</a>
          </p>

          <!-- ------------------------------------------------------- panel -->
          <aside
            class="panel"
            id="panel"
            hidden
            role="region"
            aria-labelledby="panelTitle"
            tabindex="-1"
          >
            <!-- The grip. Decorative on purpose: the close button beside it
                 is the accessible way out, so a second tab stop doing the same
                 job would be noise. Dragging it down is an enhancement on top
                 of that, the way an iOS sheet works. -->
            <div class="panel__grip" id="panelGrip" aria-hidden="true"></div>

            <div class="panel__head" id="panelHead">
              <div>
                <span class="panel__eyebrow"></span>
                <div class="panel__titlerow">
                  <h2 class="panel__title" id="panelTitle"></h2>
                </div>
                <span id="panelJobSlot"></span>
              </div>

              <!-- Save and close, as a pair. Both are icon buttons acting on
                   the card as a whole rather than on the name beside them,
                   which is why they sit together at the end of the head. -->
              <div class="panel__headacts">
                <span id="panelVisitSlot"></span>
                <button type="button" class="panel__close"></button>
              </div>
            </div>
            <div class="panel__body" id="panelBody"></div>
            <div class="panel__foot" id="panelFoot"></div>
          </aside>
        </main>
      </div>
    </div>

    <!-- The three-step tour. Shown once per person: on a first visit, and one
         final time for anybody who was already using the site before it
         existed. Its text is built in script, so it follows the language
         switch the way the account panel does. -->
    <div class="intro" id="intro" hidden>
      <div class="intro__scrim"></div>
      <div class="intro__card" role="dialog" aria-modal="true" tabindex="-1">
        <div class="intro__art" id="introArt"></div>
        <div class="intro__text" id="introText"></div>
        <div class="intro__dots" id="introDots" aria-hidden="true"></div>
        <p class="sr-only" id="introProgress" aria-live="polite"></p>
        <div class="intro__actions">
          <button type="button" class="btn btn--ghost" data-intro="skip"></button>
          <button type="button" class="btn btn--primary" data-intro="next"></button>
        </div>
      </div>
    </div>

    <p class="sr-only" id="live" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
